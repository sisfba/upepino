<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" role="img" aria-label="UPEPINO, el pepino que te cuenta el presupuesto" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7D32"/>
      <stop offset="0.45" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2E6B2F"/>
    </linearGradient>
    <linearGradient id="panza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5E8A5"/>
      <stop offset="1" stop-color="#9CD27A"/>
    </linearGradient>
    <linearGradient id="zapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B71C1C"/>
      <stop offset="1" stop-color="#7F0F0F"/>
    </linearGradient>
  </defs>
  <!-- sombra -->
  <ellipse cx="150" cy="404" rx="88" ry="11" fill="#000" opacity=".18"/>
  <!-- piernas -->
  <rect x="112" y="330" width="16" height="52" rx="8" fill="#2E6B2F"/>
  <rect x="172" y="330" width="16" height="52" rx="8" fill="#2E6B2F"/>
  <!-- zapatillas -->
  <path d="M96 392 q0-18 22-18 h14 q8 0 8 10 v10 q0 4-4 4 h-36 q-4 0-4-6z" fill="url(#zapa)"/>
  <path d="M160 392 q0-18 22-18 h14 q8 0 8 10 v10 q0 4-4 4 h-36 q-4 0-4-6z" fill="url(#zapa)" transform="translate(364 0) scale(-1 1)"/>
  <rect x="96" y="394" width="44" height="6" rx="3" fill="#fff" opacity=".9"/>
  <rect x="160" y="394" width="44" height="6" rx="3" fill="#fff" opacity=".9"/>
  <!-- brazo izquierdo (abajo) -->
  <path d="M84 210 q-30 30 -26 74" stroke="#2E6B2F" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="58" cy="288" r="12" fill="#4CAF50" stroke="#2E6B2F" stroke-width="3"/>
  <!-- cuerpo de pepino -->
  <path d="M150 30 C215 30 232 95 232 190 C232 290 205 345 150 345 C95 345 68 290 68 190 C68 95 85 30 150 30 Z" fill="url(#cuerpo)"/>
  <!-- verruguitas -->
  <g fill="#1F5A22" opacity=".55">
    <circle cx="96" cy="120" r="4"/><circle cx="210" cy="140" r="4"/><circle cx="88" cy="250" r="4"/>
    <circle cx="214" cy="262" r="4"/><circle cx="118" cy="60" r="3"/><circle cx="190" cy="70" r="3"/>
    <circle cx="100" cy="310" r="3"/><circle cx="200" cy="312" r="3"/>
  </g>
  <!-- panza clara -->
  <path d="M150 168 C192 168 204 214 204 254 C204 300 182 328 150 328 C118 328 96 300 96 254 C96 214 108 168 150 168 Z" fill="url(#panza)" opacity=".9"/>
  <!-- brote en la cabeza -->
  <path d="M150 32 q-4 -18 6 -26" stroke="#2E6B2F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M156 10 q26 -10 34 10 q-22 8 -34 -10z" fill="#66BB6A" stroke="#2E6B2F" stroke-width="2"/>
  <path d="M152 16 q-22 -14 -34 2 q18 12 34 -2z" fill="#81C784" stroke="#2E6B2F" stroke-width="2"/>
  <!-- lentes -->
  <g stroke="#3A2A1A" stroke-width="5" fill="#fff">
    <circle cx="124" cy="112" r="24"/>
    <circle cx="178" cy="112" r="24"/>
  </g>
  <path d="M148 112 h6" stroke="#3A2A1A" stroke-width="5"/>
  <!-- ojos -->
  <circle cx="128" cy="115" r="10" fill="#2B1B0E"/><circle cx="182" cy="115" r="10" fill="#2B1B0E"/>
  <circle cx="132" cy="111" r="3.5" fill="#fff"/><circle cx="186" cy="111" r="3.5" fill="#fff"/>
  <!-- cejas -->
  <path d="M108 80 q14 -9 30 -2" stroke="#1F5A22" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M164 78 q16 -7 30 2" stroke="#1F5A22" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- mejillas -->
  <ellipse cx="104" cy="146" rx="11" ry="7" fill="#F48FB1" opacity=".7"/>
  <ellipse cx="198" cy="146" rx="11" ry="7" fill="#F48FB1" opacity=".7"/>
  <!-- sonrisa -->
  <path d="M128 146 q23 26 46 0 q-23 10 -46 0z" fill="#7F1D1D" stroke="#3A2A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M140 156 q11 6 22 0" stroke="#F06292" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- cordón y fotocheck -->
  <path d="M120 170 L150 214 L180 170" stroke="#B71C1C" stroke-width="5" fill="none"/>
  <rect x="116" y="212" width="68" height="44" rx="7" fill="#fff" stroke="#B71C1C" stroke-width="3"/>
  <rect x="116" y="212" width="68" height="13" rx="6" fill="#B71C1C"/>
  <text x="150" y="245" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="12.5" fill="#7F0F0F">UPEPINO</text>
  <!-- brazo derecho saludando -->
  <g class="saludo">
  <path d="M216 196 q34 -22 40 -70" stroke="#2E6B2F" stroke-width="16" fill="none" stroke-linecap="round"/>
  <g transform="translate(258 112)">
    <circle r="15" fill="#4CAF50" stroke="#2E6B2F" stroke-width="3"/>
    <path d="M-8 -12 v-10 M0 -14 v-12 M8 -12 v-10" stroke="#2E6B2F" stroke-width="6" stroke-linecap="round"/>
  </g>
  </g>
  <style>
    .saludo { transform-origin: 216px 196px; animation: saludo 2.4s ease-in-out infinite; }
    @keyframes saludo { 0%, 60%, 100% { transform: rotate(0deg); } 70% { transform: rotate(-14deg); } 80% { transform: rotate(8deg); } 90% { transform: rotate(-10deg); } }
    @media (prefers-reduced-motion: reduce) { .saludo { animation: none; } }
  </style>
</svg>
